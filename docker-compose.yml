services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8888:8888"
    volumes:
      - ./migration.db:/app/migration.db
      - ./.secret_key:/app/.secret_key
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PORT=8888
      - DATABASE_URL=sqlite:////app/migration.db
      - SECRET_KEY_PATH=/app/.secret_key
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3333:3333"
    depends_on:
      - backend
    restart: unless-stopped
